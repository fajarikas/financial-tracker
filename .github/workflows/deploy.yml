name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm install && npm run build

      - name: Run Tests
        run: ./vendor/bin/pest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ~/financial-tracker
            git fetch --all
            git reset --hard origin/main

            # Build image
            docker build --network=host -t financial-tracker .
            
            # Remove old container
            docker rm -f financial-tracker-app || true
            
            # Run new container
            docker run -d \
              -p 8082:80 \
              --name financial-tracker-app \
              --env-file .env \
              -v $(pwd)/storage:/var/www/html/storage \
              financial-tracker

            # Post-deployment
            docker exec financial-tracker-app php artisan migrate --force
            docker exec financial-tracker-app php artisan config:cache
            docker exec financial-tracker-app php artisan route:cache
            docker exec financial-tracker-app php artisan view:cache
            docker exec financial-tracker-app php artisan storage:link

            # Fix Permissions
            docker exec -u root financial-tracker-app chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
            docker exec -u root financial-tracker-app chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache
