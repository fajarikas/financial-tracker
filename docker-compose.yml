services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-tracker-app
    container_name: financial-tracker-web
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - ./storage:/var/www/storage
      - ./public/images:/var/www/public/images
    networks:
      - financial-network

  db:
    image: mysql:8.0
    container_name: financial-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finance_tracker}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    ports:
      - "33061:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  db-data:
