services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-tracker-app
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - ./storage:/var/www/html/storage
    networks:
      - financial-network

  db:
    image: mysql:8.0
    container_name: financial-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finance_tracker}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    ports:
      - "33060:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  db-data:
