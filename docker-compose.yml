services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: financial-tracker-app
    container_name: financial-tracker-web
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: mysql:8.0
    container_name: financial-tracker-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-finance_tracker}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-root}
    ports:
      - "33061:3306"
    volumes:
      - financial-db-data:/var/lib/mysql

volumes:
  financial-db-data:
